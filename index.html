<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Інженерно-Фортифікаційний Дашборд</title>
    
    <!-- PWA та Мета-теги для Мобільних Пристроїв -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Фортифікація">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Шрифти та Іконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --bg-grid: rgba(30, 41, 59, 0.2);
            --panel-bg: #0f172a;
            --panel-border: #1e293b;
            --subpanel-bg: #1e293b;
            --subpanel-border: #334155;
            --text-main: #94a3b8;
            --text-title: #f8fafc;
            --text-muted: #64748b;
            --accent-cyan: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-indigo: #818cf8;
            --accent-green: #34d399;
            --accent-red: #f43f5e;
        }

        body.theme-mask {
            --bg-color: #050000;
            --bg-grid: rgba(100, 0, 0, 0.15);
            --panel-bg: #120202;
            --panel-border: #380505;
            --subpanel-bg: #220505;
            --subpanel-border: #4d0a0a;
            --text-main: #cc4444;
            --text-title: #ff5555;
            --text-muted: #882222;
            --accent-cyan: #ff3333;
            --accent-amber: #ff2222;
            --accent-purple: #dd2222;
            --accent-indigo: #cc1111;
            --accent-green: #ff4444;
            --accent-red: #ff1111;
        }

        body.theme-night {
            --bg-color: #020408;
            --bg-grid: transparent;
            --panel-bg: #070c14;
            --panel-border: #0f172a;
            --subpanel-bg: #0d1522;
            --subpanel-border: #1e293b;
            --text-main: #475569;
            --text-title: #94a3b8;
            --text-muted: #334155;
            --accent-cyan: #0284c7;
            --accent-amber: #d97706;
            --accent-purple: #7e22ce;
            --accent-indigo: #4338ca;
            --accent-green: #059669;
            --accent-red: #be123c;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body { 
            background-color: var(--bg-color); 
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            font-size: 13px; 
            padding: 8px; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        @media (min-width: 768px) {
            body { padding: 16px; font-size: 14px; }
        }
        
        .header { 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            padding: 10px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            margin-bottom: 10px; 
        }
        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .header h1 { 
            color: var(--text-title); 
            font-family: 'Outfit', sans-serif; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .header h1 i { color: var(--accent-cyan); }
        .header-actions { display: flex; align-items: center; gap: 6px; justify-content: space-between; width: 100%; }
        @media (min-width: 600px) { .header-actions { width: auto; } }
        
        .badge { 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid var(--accent-cyan); 
            color: var(--accent-cyan); 
            padding: 4px 6px; 
            border-radius: 6px; 
            font-size: 9px; 
            font-weight: 600; 
            white-space: nowrap;
        }

        .theme-selector {
            display: flex;
            background: var(--subpanel-bg);
            border: 1px solid var(--subpanel-border);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .theme-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .theme-btn.active {
            background: var(--panel-bg);
            color: var(--accent-cyan);
        }

        .cards { 
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }
        .cards::-webkit-scrollbar { height: 3px; }
        .cards::-webkit-scrollbar-thumb { background: var(--subpanel-border); border-radius: 2px; }

        @media (min-width: 900px) {
            .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                overflow-x: visible;
            }
        }
        
        .card { 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            border-radius: 6px; 
            padding: 6px 8px; 
            flex: 0 0 110px;
            scroll-snap-align: start;
        }
        @media (min-width: 900px) { .card { flex: initial; } }
        
        .card-title { color: var(--text-muted); font-size: 8px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .card-val { color: var(--text-title); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; }
        .card-val.amber { color: var(--accent-amber); }
        .card-val.blue { color: var(--accent-cyan); }
        .card-val.purple { color: var(--accent-purple); }
        .card-sub { font-size: 8px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            overflow-x: auto;
            white-space: nowrap;
            background: var(--subpanel-bg);
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--subpanel-border);
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .filter-bar::-webkit-scrollbar { height: 2px; }
        .filter-label { font-size: 9px; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; }
        .filter-btn {
            background: var(--panel-bg);
            border: 1px solid var(--subpanel-border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
        }
        .filter-btn.active {
            background: var(--accent-cyan);
            color: var(--panel-bg);
            font-weight: 600;
        }

        .dig-method-selector {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 6px;
            border-radius: 6px;
        }
        @media (min-width: 400px) {
            .dig-method-selector { flex-direction: row; align-items: center; justify-content: space-between; }
        }
        .dig-method-title { font-size: 9px; font-weight: 700; color: var(--accent-amber); text-transform: uppercase; }
        .dig-options { display: flex; gap: 4px; width: 100%; }
        @media (min-width: 400px) { .dig-options { width: auto; } }
        
        .dig-btn {
            flex: 1;
            background: var(--subpanel-bg);
            border: 1px solid var(--subpanel-border);
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .dig-btn.active { background: var(--accent-amber); color: #000; }

        .grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        @media (min-width: 960px) { .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; } }

        .panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 8px; 
            width: 100%;
        }
        
        .panel-title { 
            color: var(--text-title); 
            font-family: 'Outfit', sans-serif; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            border-bottom: 1px solid var(--panel-border); 
            padding-bottom: 6px; 
        }
        .panel-title i { color: var(--accent-cyan); }

        .panel-title-toggle {
            cursor: pointer;
            user-select: none;
            justify-content: space-between;
            margin-bottom: 0;
            padding-bottom: 6px;
        }
        .toggle-icon { font-size: 11px; transition: transform 0.3s ease; }
        .toggle-icon.collapsed { transform: rotate(-90deg); }

        .inputs { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            margin-bottom: 8px; 
            width: 100%;
        }
        @media (min-width: 480px) { 
            .inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; } 
        }
        @media (min-width: 768px) { 
            .inputs { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); } 
        }
        
        .input-box { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .input-box label { font-size: 10px; color: var(--text-main); }
        .input-box input, .input-box select { 
            background: var(--subpanel-bg); 
            border: 1px solid var(--subpanel-border); 
            border-radius: 4px; 
            color: var(--text-title); 
            padding: 6px; 
            outline: none; 
            font-size: 12px; 
            width: 100%; 
        }

        .sum-box { 
            background: var(--subpanel-bg); 
            border-left: 3px solid var(--accent-cyan); 
            border-radius: 4px; 
            padding: 8px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 6px; 
            margin-bottom: 8px; 
        }
        .sum-box.amber { border-left-color: var(--accent-amber); }
        .sum-box.purple { border-left-color: var(--accent-purple); }
        .sum-item { display: flex; flex-direction: column; }
        .sum-item .lbl { font-size: 8px; color: var(--text-muted); text-transform: uppercase; }
        .sum-item .val { font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--accent-cyan); font-weight: 600; }
        .sum-item .val.amber { color: var(--accent-amber); }
        .sum-item .val.purple { color: var(--accent-purple); }

        .collapsible-wrapper {
            transition: max-height 0.35s ease, opacity 0.25s ease;
            overflow: hidden;
            max-height: 1500px;
            opacity: 1;
            margin-top: 8px;
        }
        .collapsible-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            pointer-events: none;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .compare-table, table { width: 100%; border-collapse: collapse; font-size: 10px; }
        .compare-table th, .compare-table td, th, td { padding: 4px 6px; border: 1px solid var(--panel-border); text-align: center; }
        th { background: var(--subpanel-bg); color: var(--accent-cyan); font-size: 9px; text-transform: uppercase; }

        .blueprint-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--panel-border);
            -webkit-overflow-scrolling: touch;
        }
        .blueprint-btn {
            background: var(--subpanel-bg);
            border: 1px solid var(--subpanel-border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
        }
        .blueprint-btn.active { background: var(--accent-cyan); color: var(--panel-bg); }
        .blueprint-viewer { background: #000; border: 1px solid var(--subpanel-border); border-radius: 6px; padding: 6px; width: 100%; }
        .blueprint-img { width: 100%; max-height: 280px; object-fit: contain; background: #fff; border-radius: 4px; }

        .transport-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
        .transport-card { background: var(--subpanel-bg); border: 1px solid var(--subpanel-border); border-radius: 6px; padding: 6px; }
        .transport-name { color: var(--text-title); font-weight: 600; font-size: 10px; }
        .transport-trips { font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--accent-cyan); }

        .reminders-grid { display: flex; flex-direction: column; gap: 6px; }
        .reminder-card { background: var(--subpanel-bg); border-radius: 6px; padding: 8px; border-left: 3px solid var(--accent-cyan); }
        .reminder-card.teal { border-left-color: var(--accent-green); }
        .reminder-header { color: var(--text-title); font-weight: 600; font-size: 11px; margin-bottom: 2px; }
        .reminder-list { list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 9px; }

        .pie-layout { display: flex; flex-direction: column; gap: 8px; }
        @media (min-width: 480px) { .pie-layout { flex-direction: row; align-items: center; } }
        .pie-left { display: flex; justify-content: center; width: 100%; }
        .pie-right { width: 100%; display: flex; flex-direction: column; gap: 6px; }

        .work-progress-list { display: flex; flex-direction: column; gap: 6px; }
        .work-info { display: flex; justify-content: space-between; font-size: 9px; }
        .work-bar { width: 100%; height: 4px; background: var(--subpanel-bg); border-radius: 2px; overflow: hidden; }
        .work-fill { height: 100%; border-radius: 2px; }

        .time-widget-box { background: var(--subpanel-bg); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .time-big-val { font-family: 'Outfit', sans-serif; font-size: 18px; color: var(--accent-green); font-weight: 700; }
        .time-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 9px; }

        .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 110px; width: 100%; border-bottom: 1px solid var(--panel-border); padding-top: 6px; }
        .bar-col { display: flex; flex-direction: column; align-items: center; width: 13%; height: 100%; justify-content: flex-end; }
        .bar-fill { width: 100%; max-width: 18px; background: var(--accent-amber); border-radius: 2px 2px 0 0; min-height: 3px; }
        .bar-lbl { font-size: 7px; color: var(--text-main); margin-top: 2px; text-align: center; }

        .req-container { display: flex; flex-direction: column; gap: 6px; }
        .req-box { border-radius: 4px; padding: 8px; background: var(--panel-bg); }
        .req-box.amber { border: 1px solid var(--accent-amber); }
        .req-box.blue { border: 1px solid var(--accent-cyan); }
        .req-title { font-size: 10px; font-weight: 600; }
        .req-text { font-size: 9px; color: var(--text-main); }

        .export-box { background: var(--subpanel-bg); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .btn-export { width: 100%; background: var(--panel-bg); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .report-preview { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 4px; padding: 8px; font-family: monospace; font-size: 9px; color: var(--text-title); white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-shield-halved"></i> Інженерний Дашборд</h1>
        <div class="header-actions">
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="default" title="Денний"><i class="fa-solid fa-sun"></i> День</button>
                <button class="theme-btn" data-theme="night" title="Світломаскування"><i class="fa-solid fa-moon"></i> Ніч</button>
                <button class="theme-btn" data-theme="mask" title="Червоне"><i class="fa-solid fa-triangle-exclamation"></i> Маск</button>
            </div>
            <span class="badge">ТАКТИЧНИЙ</span>
        </div>
    </div>

    <!-- Верхні картки -->
    <div class="cards">
        <div class="card">
            <div class="card-title">Колоди</div>
            <div class="card-val" id="c-logs">0 м<sup>3</sup></div>
            <div class="card-sub">⌀18-22см/3 шари</div>
        </div>
        <div class="card">
            <div class="card-title">Дошка/Брус</div>
            <div class="card-val" id="c-lumber">0 м<sup>3</sup></div>
            <div class="card-sub">Обрізна/підсилення</div>
        </div>
        <div class="card">
            <div class="card-title">Плівка</div>
            <div class="card-val" id="c-film">0 м<sup>2</sup></div>
            <div class="card-sub">300 мкм гідроізол.</div>
        </div>
        <div class="card">
            <div class="card-title">Скоби</div>
            <div class="card-val" id="c-staples">0 шт</div>
            <div class="card-sub">Будівельні ⌀12мм</div>
        </div>
        <div class="card">
            <div class="card-title">Люд-Години</div>
            <div class="card-val purple" id="c-manhours">0 год</div>
            <div class="card-sub" id="c-manhours-sub">Ручна праця</div>
        </div>
        <div class="card">
            <div class="card-title">Пальне</div>
            <div class="card-val amber" id="c-fuel">0 л</div>
            <div class="card-sub">ДП / сер. 9л/год</div>
        </d
